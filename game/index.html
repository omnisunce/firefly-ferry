<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firefly Ferry — a night-river arcade game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1030; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; background: #0b1030; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Firefly Ferry: steer the lantern boat, catch fireflies, deliver them to the glowing docks, and dodge rocks and logs"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
